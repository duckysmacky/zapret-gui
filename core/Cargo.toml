[package]
name = "zapret-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
lewton = "0.10.2"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs", "net", "io-util"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "registry", "ansi"] }
zip = { version = "9.6.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
insta = "1.49.0"
serde_json = "1.0.154"
tempfile = "3.27.0"

[features]
# Use the mock platform on Windows too (UI work in the VM).
mock-platform = []

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Services", "Win32_System_Registry", "Win32_System_Diagnostics_ToolHelp", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_ProcessStatus", "Win32_System_IO", "Win32_Media_Audio"] }
